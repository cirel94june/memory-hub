name: One-time VPS Read-only Audit

on:
  push:
    paths:
      - ".github/workflows/vps-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Collect encrypted read-only diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            umask 077
            AUDIT_DIR="$(mktemp -d)"
            trap 'rm -rf "$AUDIT_DIR"' EXIT

            cat > "$AUDIT_DIR/public.pem" <<'AUDIT_PUBLIC_KEY'
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7G/4Ma7E0MZQ4tBcQj2Z
            bS6ikp2weJa8Bb6FLpI4bGLm6f5biqIOLkAszGIpjFjelJzyreGlVIU2/PRD1s4b
            ycAHaP5D0CW117USc/61mZou6IX/sltv+xpQPcPn02DU99zxlBNu/n1x689RsK8M
            TQPBb0aTgfpH+mViSJFInlvxf1QucTEIeBaIliTFz/MhGtlhTEHJxl1+xwLg4auQ
            SvSj7nune3Ar0FhYGx3VhqNmYBOL7bWdUaKpFDW4hHYuDdkXdrVYD6kgILRR+4b7
            b18pwpHYpu4ZFcwOr+dSOuDloMNXoDI6yb0YAMSJuDSb4bRxoO7B2+jRzTtird6M
            8wIDAQAB
            -----END PUBLIC KEY-----
            AUDIT_PUBLIC_KEY

            {
              echo "=== TIME AND OS ==="
              date -u
              uname -a
              cat /etc/os-release 2>/dev/null || true
              systemd-detect-virt 2>/dev/null || true

              echo "=== CPU ==="
              nproc
              lscpu 2>/dev/null | grep -E '^(Architecture|CPU\(s\)|Model name|Thread|Core|Socket|Virtualization|Hypervisor)' || true

              echo "=== MEMORY AND SWAP ==="
              free -h
              swapon --show 2>/dev/null || true
              cat /proc/sys/vm/swappiness 2>/dev/null || true

              echo "=== LOAD AND UPTIME ==="
              uptime
              cat /proc/loadavg

              echo "=== DISK ==="
              df -hT -x tmpfs -x devtmpfs
              df -hi -x tmpfs -x devtmpfs
              du -sh /opt/memory-hub/data 2>/dev/null || true
              find /opt/memory-hub/data -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort || true

              echo "=== TOP MEMORY PROCESSES ==="
              ps -eo pid,user,comm,%cpu,%mem,rss --sort=-rss | head -n 25

              echo "=== RUNNING SERVICES ==="
              systemctl list-units --type=service --state=running --no-pager --no-legend 2>/dev/null || true
              systemctl --failed --no-pager 2>/dev/null || true
              systemctl show memory-hub -p ActiveState -p SubState -p MainPID -p MemoryCurrent -p MemoryPeak -p CPUUsageNSec -p NRestarts 2>/dev/null || true

              echo "=== LISTENING PORTS ==="
              ss -lntupH 2>/dev/null || true

              echo "=== FIREWALL ==="
              ufw status verbose 2>/dev/null || true
              nft list ruleset 2>/dev/null | head -n 160 || true

              echo "=== SSH EFFECTIVE SECURITY ==="
              sshd -T 2>/dev/null | grep -E '^(port|permitrootlogin|passwordauthentication|pubkeyauthentication|maxauthtries|allowusers|allowgroups|x11forwarding)' || true

              echo "=== DOCKER ==="
              docker version --format '{{.Server.Version}}' 2>/dev/null || true
              docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' 2>/dev/null || true

              echo "=== RUNTIMES ==="
              python3 --version 2>/dev/null || true
              node --version 2>/dev/null || true
              npm --version 2>/dev/null || true

              echo "=== RECENT RESOURCE FAILURES ==="
              journalctl -k --since '30 days ago' --no-pager 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process|I/O error|segfault' | tail -n 80 || true
            } > "$AUDIT_DIR/audit.txt" 2>&1

            PASS="$(openssl rand -hex 32)"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 10000               -in "$AUDIT_DIR/audit.txt" -out "$AUDIT_DIR/audit.enc"               -pass "pass:$PASS"
            printf '%s' "$PASS" | openssl pkeyutl -encrypt -pubin               -inkey "$AUDIT_DIR/public.pem"               -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256               -out "$AUDIT_DIR/key.enc"

            echo "AUDIT_KEY_B64_BEGIN"
            base64 -w0 "$AUDIT_DIR/key.enc"
            echo
            echo "AUDIT_KEY_B64_END"
            echo "AUDIT_DATA_B64_BEGIN"
            base64 -w0 "$AUDIT_DIR/audit.enc"
            echo
            echo "AUDIT_DATA_B64_END"
